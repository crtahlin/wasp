name: Bug in this fork
description: Something in wasp is broken
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        For bugs in **upstream Bee** that also affect stock nodes, consider reporting
        them at [ethersphere/bee](https://github.com/ethersphere/bee/issues) as well —
        but file here too if we intend to carry a fork-local fix.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `bee version` — include the upstream base it reports.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Redact addresses, keys, and batch IDs — this repository is public."
      render: text
  - type: dropdown
    id: stock
    attributes:
      label: Does stock Bee at the same upstream base also do this?
      description: >-
        Answer "Yes" only if you checked the code at upstream/v2.8.1 or
        upstream/master and found the defect present and unmodified there, or
        reproduced it on a stock build. A "Yes" earns the affects-upstream label,
        which is a marker for a later decision by the repository owner — it never
        authorises contacting ethersphere. See rule 11 in AGENTS.md. If you have
        not checked, answer "Not tested"; a guess here is worse than a blank.
      options: ["No — fork-only", "Yes — upstream too", "Not tested"]
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        *If this issue was written with AI assistance, end it with
        `Generated with help of AI.` — see `AGENTS.md`.*
