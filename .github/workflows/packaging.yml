name: Packaging

# Guards issue #177 cheaply. The distribution was renamed bee-experimental ->
# wasp, and a package that drops the old names from Conflicts/Replaces cannot
# take over an existing install's files: dpkg refuses the upgrade, and the only
# manual route out purges the data directory. That break is invisible to every
# other check because it only shows on a host that already has the old package.
#
# This asserts the relationships directly in .goreleaser.yml, in under a second.
# The thorough built-artifact test (packaging/test-deb-upgrade.sh) belongs in
# the release pipeline, where the debs already exist: building the full release
# with goreleaser just to inspect a control field was measured at 25+ minutes,
# which is not worth running on every packaging change. See issue #179.

on:
  pull_request:
    paths:
      - '.goreleaser.yml'
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yaml'
      - 'scripts/check-release-notes.sh'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - '.goreleaser.yml'
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yaml'
      - 'scripts/check-release-notes.sh'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-relationships:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Check deb/rpm Conflicts and Replaces
        run: python3 packaging/check-package-relationships.py

      - name: Check the release notes can be built
        # release.yaml assembles a release's notes by pattern, from the README
        # highlights block and the newest CHANGELOG.md section. Neither
        # extraction fails loudly on its own: a renamed marker or a changed
        # heading just yields nothing, or the wrong version's section, and the
        # release page goes out wrong. Checked here rather than at release
        # time. See #481.
        run: scripts/check-release-notes.sh
