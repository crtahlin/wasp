name: Release

# Fires on this fork's own release tags, pushed by prepare-release.yml.
#
# Rewritten from upstream's release workflow: every publishing target upstream
# uses (Docker Hub, Quay, Gemfury, the Homebrew tap, the Scoop bucket) belongs
# to Ethersphere and needs organisation secrets this fork does not and must not
# have. Artifacts go to this repository's own releases and to GHCR.

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*.*.*'
  # Dispatchable because a tag pushed with GITHUB_TOKEN does not trigger the
  # push event above — GitHub suppresses that to prevent workflow recursion.
  # tag-release.yml therefore dispatches this explicitly, with --ref set to the
  # tag it just pushed.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version-file: go.mod
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-release-${{ hashFiles('**/go.sum') }}
          # Cross-compilation recompiles deps per architecture; seed from the
          # most recent build cache so each release is incremental, not cold.
          restore-keys: |
            ${{ runner.os }}-go-release-
            ${{ runner.os }}-go-
      - name: GHCR login
        # GITHUB_TOKEN is enough for this repository's own package namespace,
        # so no long-lived registry credential has to exist anywhere.
        run: printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install upx
        # The linux-slim build has a post hook that runs upx. Upstream never
        # installs it; assuming it is on the runner is how that build breaks.
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
      - name: Set build-time versions
        run: |
          echo "BEE_API_VERSION=$(grep '^  version:' openapi/Swarm.yaml | awk '{print $2}')" >> $GITHUB_ENV
          echo "UPSTREAM_BASE=$(cat .upstream-base)" >> $GITHUB_ENV
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release --clean --timeout 1h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEE_API_VERSION: ${{ env.BEE_API_VERSION }}
          UPSTREAM_BASE: ${{ env.UPSTREAM_BASE }}
