name: Prepare release

# Step one of two in cutting a release.
#
# Derives the next version and changelog from the first-parent spine of main
# with git-cliff, then opens a PULL REQUEST containing the CHANGELOG.md update.
# It deliberately does not push to main and does not tag: main is protected, and
# the release commit goes through review like every other change here rather
# than the release bot getting an exemption.
#
# Merging that pull request triggers tag-release.yml, which tags the merge
# commit and starts the build.
#
# Manual on purpose. Releases here carry experimental changes onto other
# people's nodes, so the decision to cut one is a human one.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the version and changelog without committing or tagging'
        type: boolean
        default: true
      version:
        description: 'Explicit tag to cut, e.g. v0.1.0-test.1. Leave empty to let git-cliff compute it. A semver prerelease suffix (-test, -rc) makes goreleaser mark the GitHub release as a pre-release and suppresses the rolling latest / major / minor Docker tags.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Install git-cliff
        # Installed as a pinned binary rather than via orhun/git-cliff-action:
        # that action runs git-cliff itself and does NOT leave it on PATH, so
        # every later step failed with "git-cliff: command not found". Pinning
        # the version also means a release is reproducible — an unpinned
        # "latest" could change changelog grouping between two releases.
        env:
          GIT_CLIFF_VERSION: '2.13.1'
        run: |
          set -euo pipefail
          ASSET="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${ASSET}"
          curl -fsSL "$URL" -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Compute next version
        id: v
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            NEXT="${{ inputs.version }}"
            case "$NEXT" in
              v[0-9]*) ;;
              *) echo "::error::version must start with v followed by a digit (got '$NEXT')"; exit 1 ;;
            esac
            echo "Using explicit version: $NEXT"
          else
            NEXT="$(git-cliff --bumped-version)"
            echo "Computed next version: $NEXT"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Preview changelog
        run: |
          echo '--- entries that will ship ---'
          git-cliff --unreleased --tag '${{ steps.v.outputs.next }}'
          echo '--- end ---'
          echo
          echo 'If upstream commit subjects appear above, STOP: the merge-commit'
          echo 'discipline has been broken and the changelog is wrong. See'
          echo 'docs/agent-playbooks/release-process.md.'

      - name: Guard against upstream leakage
        # Cheap tripwire for the one failure mode that silently corrupts a
        # release: a squashed merge putting upstream commits on the spine.
        run: |
          set -euo pipefail
          if git-cliff --unreleased --tag '${{ steps.v.outputs.next }}' | grep -qE '^- (Merge |Pull from upstream)'; then
            echo "::error::Upstream merge commits leaked into the changelog. Do not release."
            exit 1
          fi

      - name: Verify before opening the pull request
        # A pull request opened by a workflow using GITHUB_TOKEN is authored by
        # github-actions[bot], and GitHub holds its check runs in
        # action_required pending manual approval, so it can be merged with no
        # checks having run at all.
        #
        # That is not hypothetical here: the first release pull request (#43)
        # merged with zero checks and put a lint failure on main. Run the
        # cheap, high-value checks before the pull request exists so
        # verification does not depend on pull request CI firing. See #45.
        run: |
          set -euo pipefail
          echo "::group::whitespace"
          make check-whitespace
          echo "::endgroup::"
          echo "::group::protocol freeze"
          ./scripts/protocol-freeze.sh --check
          echo "::endgroup::"

      - name: Open release pull request
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEXT='${{ steps.v.outputs.next }}'
          BRANCH="release/$NEXT"
          # --prepend requires the file to exist, and on the first release it
          # does not. git-cliff does not re-emit the header when prepending to a
          # file that already has one, so this is safe on every later release too.
          touch CHANGELOG.md
          git-cliff --tag "$NEXT" --prepend CHANGELOG.md --unreleased
          # Strip trailing blank lines. `make check-whitespace` rejects "new
          # blank line at EOF", so a changelog that ends in one turns main red
          # on the next pull request. Normalising here rather than relying on
          # the cliff.toml template means a later template edit cannot
          # reintroduce it.
          printf '%s\n' "$(cat CHANGELOG.md)" > CHANGELOG.md
          git config user.name 'release[bot]'
          git config user.email 'release@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add CHANGELOG.md
          git commit -m "chore(release): $NEXT"
          git push -u origin "$BRANCH" --force-with-lease

          BODY_FILE="$(mktemp)"
          {
            echo "Release **$NEXT**, built on upstream bee \`$(cat .upstream-base)\`."
            echo
            echo "Merging this pull request tags the merge commit and starts the build."
            echo "The tag is pushed by \`tag-release.yml\`; it is not created here."
            echo
            echo "Check the changelog below is only this fork's changes. If any entry"
            echo "starts with \`Merge \` or \`Pull from upstream\`, something was"
            echo "squash-merged and the changelog is misattributing upstream's work."
            echo
            echo '---'
            echo
            git-cliff --tag "$NEXT" --unreleased
            echo
            echo 'Generated with help of AI.'
          } > "$BODY_FILE"

          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): $NEXT" \
            --body-file "$BODY_FILE" \
            --label release --label chore
