name: Go

on:
  push:
    paths-ignore:
      - packaging/**
      - openapi/**
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
    branches:
      - 'main'
  # Deliberately NO paths-ignore on pull_request.
  #
  # A path-filtered workflow does not report a skipped job, and a required
  # status check that never reports blocks the pull request forever. That is
  # not hypothetical: making Lint and Test required while '**/*.md' was
  # filtered here left every docs-only pull request unmergeable, including the
  # release pull request, which touches only CHANGELOG.md. codeql.yml carries
  # the same warning about its own filter.
  #
  # The jobs stay cheap on documentation-only changes by skipping their
  # expensive steps instead of skipping the job, so the contexts still report.
  # See issue #45.
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        cache: true
        go-version-file: go.mod
    - name: Are there code changes?
      id: changed
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Documentation-only pull requests still report these contexts, but
        # skip the work. Compare against the merge base rather than the tip so
        # a stale base does not look like a code change.
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Ask GitHub which files changed rather than diffing locally.
        # actions/checkout fetches depth 1, so `git diff base...HEAD` has no
        # merge base and dies with "no merge base" — which is what happened on
        # the first documentation-only pull request after this was added.
        # Harmlessly, because the detector fails open, but it meant the skip
        # never once engaged.
        FILES=$(gh api --paginate \
          "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
          --jq '.[].filename' 2>/dev/null || echo "")
        # Fail open: no evidence means run everything, never skip.
        if [ -z "$FILES" ]; then
          echo "could not determine changed files; running everything"
          echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "changed files:"; echo "$FILES" | sed 's/^/  /'
        if echo "$FILES" | grep -qvE '(\.md$|^packaging/|^openapi/|^\.github/ISSUE_TEMPLATE/)'; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "documentation-only change; skipping build and tests"
        fi
    - name: Increase UDP buffer sizes (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && steps.changed.outputs.code == 'true'
      run: |
        sudo sysctl -w net.core.rmem_max=7500000
        sudo sysctl -w net.core.wmem_max=7500000
    - name: Increase UDP buffer sizes (macOS)
      if: matrix.os == 'macos-latest' && steps.changed.outputs.code == 'true'
      run: |
        sudo sysctl -w kern.ipc.maxsockbuf=6291456
    - name: Build
      if: steps.changed.outputs.code == 'true'
      run: make build
    - name: SIMD stub must run on a scratch stack
      if: matrix.os == 'ubuntu-latest'
      # Guards #92. The stub must switch SP to a caller-supplied scratch stack
      # before calling the XKCP blob. Running that foreign code on the goroutine
      # stack corrupts memory and kills the node in ~12 minutes under load.
      #
      # The hasher's own tests cannot catch a regression here: they check that
      # digests are correct, and they are correct either way. The symptom only
      # appears on a loaded node, minutes later, in an unrelated subsystem. So
      # assert the property in CI instead.
      shell: bash
      run: |
        # Strip comments first: these strings must be real instructions, not
        # prose about them. The original guard grepped raw text and would have
        # been satisfied by a comment.
        fail=0
        for f in pkg/keccak/keccak_times4_linux_amd64.s pkg/keccak/keccak_times8_linux_amd64.s; do
          code=$(sed 's://.*::' "$f")
          need() {
            if ! grep -qF "$1" <<<"$code"; then
              echo "::error file=$f::missing '$1' — $2 (see issue #92)"
              fail=1
            fi
          }
          need 'MOVQ SP, BX'    'the goroutine stack pointer is no longer saved in a register'
          need 'MOVQ BX, (AX)'  'the goroutine stack pointer is no longer saved on the scratch stack'
          need 'MOVQ AX, SP'    'the blob no longer runs on a scratch stack, which is the bug itself'
          need 'MOVQ BX, SP'    'the goroutine stack pointer is never restored, which is worse than the bug'
          need 'SUBQ BX, CX'    'the two saved stack pointers are no longer compared'
          need 'NOSPLIT'        'a stack-growth prologue may be emitted while SP is not the one Go expects'
          need 'NO_LOCAL_POINTERS' 'the frame may be scanned as if it held live pointers'
          # No FP reference may appear while SP is not the goroutine stack
          # pointer. FP is SP-relative, so every such reference is garbage.
          # Reading the arguments before the switch and writing the return
          # value after the restore is what makes this stub correct; the write
          # after the restore is legitimate and must not trip the check.
          sw=$(grep -n 'MOVQ AX, SP' <<<"$code" | head -1 | cut -d: -f1)
          rs=$(grep -n 'MOVQ BX, SP' <<<"$code" | head -1 | cut -d: -f1)
          if [ -z "$sw" ] || [ -z "$rs" ] || [ "$sw" -ge "$rs" ]; then
            echo "::error file=$f::cannot locate the stack switch and restore in order (see issue #92)"
            fail=1
          elif sed -n "$((sw+1)),$((rs-1))p" <<<"$code" | grep -q '(FP)'; then
            echo "::error file=$f::an FP reference occurs while SP points at the scratch stack (see issue #92)"
            fail=1
          fi
        done
        [ "$fail" -eq 0 ] || exit 1
        echo "ok: both SIMD stubs switch to a scratch stack, restore it, cross-check it, and read their arguments first"
    - name: Green Tea GC must stay disabled
      if: matrix.os == 'ubuntu-latest' && steps.changed.outputs.code == 'true'
      # Guards issue #69: Go 1.26's default Green Tea GC corrupts the heap under
      # wasp's allocation profile. This is invisible until a node crashes in
      # production, so assert the build setting is actually recorded in the binary.
      shell: bash
      run: |
        make binary
        if ! go version -m dist/bee | grep -q 'GOEXPERIMENT=nogreenteagc'; then
          echo "::error::dist/bee was built WITHOUT GOEXPERIMENT=nogreenteagc (see issue #69)"
          go version -m dist/bee | grep -E 'build\s+(GO|CGO)' || true
          exit 1
        fi
        echo "ok: $(go version -m dist/bee | grep GOEXPERIMENT | tr -s ' ')"
    - name: Test with race detector (Ubuntu and MacOS)
      if: matrix.os != 'windows-latest' && steps.changed.outputs.code == 'true'
      run: make test-ci-race
    - name: Test without race detector (Windows)
      if: matrix.os == 'windows-latest' && steps.changed.outputs.code == 'true'
      run: make test-ci
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version-file: go.mod
    - name: Are there code changes?
      id: changed
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Ask GitHub which files changed rather than diffing locally.
        # actions/checkout fetches depth 1, so `git diff base...HEAD` has no
        # merge base and dies with "no merge base" — which is what happened on
        # the first documentation-only pull request after this was added.
        # Harmlessly, because the detector fails open, but it meant the skip
        # never once engaged.
        FILES=$(gh api --paginate \
          "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
          --jq '.[].filename' 2>/dev/null || echo "")
        # Fail open: no evidence means run everything, never skip.
        if [ -z "$FILES" ]; then
          echo "could not determine changed files; running everything"
          echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "changed files:"; echo "$FILES" | sed 's/^/  /'
        if echo "$FILES" | grep -qvE '(\.md$|^packaging/|^openapi/|^\.github/ISSUE_TEMPLATE/)'; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "documentation-only change; skipping the Go linters"
        fi
    - name: Commit linting
      if: github.ref != 'refs/heads/main'
      uses: wagoid/commitlint-github-action@v5
      with:
        configFile: commitlint.config.js
    - name: GolangCI-Lint
      if: steps.changed.outputs.code == 'true'
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      with:
        # Disable the golangci-lint cache: a restored stale cache has produced
        # phantom staticcheck findings in files unrelated to the PR diff. The
        # full lint run is fast enough that correctness is worth the trade-off.
        skip-cache: true
        version: v2.11.3
    - name: Whitespace check
      run: make check-whitespace
    - name: go mod tidy check
      if: steps.changed.outputs.code == 'true'
      uses: katexochen/go-tidy-check@v2
