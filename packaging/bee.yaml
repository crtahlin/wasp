## Bee configuration - https://docs.ethswarm.org/docs/working-with-bee/configuration

## allow to advertise private CIDRs to the public network
# allow-private-cidrs: false
## HTTP API listen address
# api-addr: 127.0.0.1:1633
## chain block time
# block-time: "5"
## block number cache sync interval in blocks
# block-sync-interval: 10
## blockchain rpc configuration
##
## endpoint accepts one value or a list. With more than one the node fails over
## between them in the order given, so a provider outage stops being a node
## outage. A single endpoint behaves exactly as before.
##
##   endpoint:
##     - https://primary.example/rpc
##     - https://standby.example/rpc
##
## Reads fail over. Sending a transaction does not: a lost response may mean the
## first endpoint accepted it, so retrying elsewhere risks a duplicate. All
## endpoints must be on the same chain; the node refuses to start otherwise.
# blockchain-rpc:
#   endpoint: ""
#   dial-timeout: 30s
#   tls-timeout: 10s
#   idle-timeout: 90s
#   keepalive: 30s
## initial nodes to connect to
# bootnode: ["/dnsaddr/mainnet.ethswarm.org"]
## chunk loads the reserve sampler keeps in flight.
##
## Sampling loads chunks from disk and hashes them. Those are separate pools:
## loading is disk-bound, hashing is CPU-bound. This sets the loading side.
##
## 0 uses the default, which matches the CPU count and behaves as it did when
## the two were one pool. Raising it offers the storage layer more concurrent
## reads, which helps only if the disk has headroom; on a contended disk it
## queues instead. Lowering it under-drives the disk and lengthens sampling,
## which risks missing a redistribution round.
##
## The sample itself does not change with this setting, whatever it is set to.
# sampler-read-concurrency: 0
## cause the node to always accept incoming connections
# bootnode-mode: false
## bzz token contract address
# bzz-token-address: ""
## cache capacity in chunks, multiply by 4096 to get approximate capacity in bytes
# cache-capacity: "1000000"
## enable forwarded content caching
# cache-retrieval: true
## enable chequebook
# chequebook-enable: true
## reject full-node hive/handshake records that carry no chequebook address
# chequebook-verification: false
## config file (default is $HOME/.bee.yaml)
config: "/etc/bee/bee.yaml"
## origins with CORS headers enabled
# cors-allowed-origins: []
## data directory
data-dir: "/var/lib/bee"
## size of block cache of the database in bytes
# db-block-cache-capacity: "33554432"
## disables db compactions triggered by seeks
# db-disable-seeks-compaction: true
## number of open files allowed by database
# db-open-files-limit: "200"
## size of the database write buffer in bytes
# db-write-buffer-size: "33554432"
## cause the node to start in full mode
# full-node: false
## help for printconfig
# help: false
## triggers connect to main net bootnodes.
# mainnet: true
## minimum gas tip cap in wei for transactions, 0 means use suggested gas tip cap
# minimum-gas-tip-cap: 0
## minimum radius storage threshold
# minimum-storage-radius: "0"
## NAT exposed address
# nat-addr: ""
## suggester for target neighborhood
# neighborhood-suggester: https://api.swarmscan.io/v1/network/neighborhoods/suggestion
## ID of the Swarm network
# network-id: "1"
## P2P listen address
# p2p-addr: :1634
## enable P2P WebSocket transport
# p2p-ws-enable: false
## password for decrypting keys
# password: ""
## path to a file that contains password for decrypting keys
password-file: "/var/lib/bee/password"
## percentage below the peers payment threshold when we initiate settlement
# payment-early-percent: 50
## threshold in BZZ where you expect to get paid from your peers
# payment-threshold: "13500000"
## excess debt above payment threshold in percentages where you disconnect from your peer
# payment-tolerance-percent: 25
## postage stamp contract address
# postage-stamp-address: ""
## postage stamp contract start block number
# postage-stamp-start-block: "0"
## enable pprof mutex profile
# pprof-mutex: false
## enable pprof block profile
# pprof-profile: false
## price oracle contract address
# price-oracle-address: ""
## redistribution contract address
# redistribution-address: ""
## reserve capacity doubling
# reserve-capacity-doubling: 0
## ENS compatible API endpoint for a TLD and with contract address, can be repeated, format [tld:][contract-addr@]url
# resolver-options: []
## forces the node to resync postage contract data
# resync: false
## skip postage snapshot
# skip-postage-snapshot: false
## staking contract address
# staking-address: ""
## lru memory caching capacity in number of statestore entries
# statestore-cache-capacity: "100000"
## protect nodes from getting kicked out on bootnode
# static-nodes: []
## enable storage incentives feature
# storage-incentives-enable: true
## enable swap
# swap-enable: false
## swap factory addresses
# swap-factory-address: ""
## initial deposit if deploying a new chequebook
# swap-initial-deposit: "0"
## neighborhood to target in binary format (ex: 111111001) for mining the initial overlay
# target-neighborhood: ""
## enable tracing
# tracing-enable: false
## endpoint to send tracing data
# tracing-endpoint: 127.0.0.1:6831
## host to send tracing data
# tracing-host: ""
## port to send tracing data
# tracing-port: ""
## service name identifier for tracing
# tracing-service-name: bee
## gas limit fallback when estimation fails for contract transactions (default 500000)
# gas-limit-fallback: 500000
## skips the gas estimate step for contract transactions
# transaction-debug-mode: false
## log verbosity level 0=silent, 1=error, 2=warn, 3=info, 4=debug, 5=trace
# verbosity: info
## maximum node warmup duration; proceeds when stable or after this time
# warmup-time: 5m0s
## send a welcome message string during handshakes
# welcome-message: ""
## withdrawal target addresses
# withdrawal-addresses-whitelist: []
## enable wss p2p connections (default: false)
# p2p-wss-enable: false
## wss address (default: :1635)
# p2p-wss-addr: :1635
## WSS NAT exposed address
# nat-wss-addr: ""
## autotls domain (default: libp2p.direct)
# autotls-domain: ""
## autotls registration endpoint (default: https://registration.libp2p.direct)
# autotls-registration-endpoint: ""
## autotls ca endpoint (default: https://acme-v02.api.letsencrypt.org/directory)
# autotls-ca-endpoint: ""
# Use the SIMD BMT hasher. Leave this commented out: unset means "enable it
# where the CPU supports it", which is linux/amd64 with AVX2 or AVX-512, and
# off everywhere else. Measured on an AVX2 machine: 25% off reserve-sample
# wall clock.
#
# Setting it explicitly is strict. true on hardware without AVX2 refuses to
# start, rather than quietly falling back, so that asking for it means being
# sure of it. Set false to keep the pure-Go path on capable hardware.
# use-simd-hashing: false
