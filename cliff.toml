# Changelog configuration for wasp.
#
# WHY NOT release-please: it fetches history through GitHub's GraphQL
# Commit.history, which has no first-parent option, and stops only at the
# previous release's commit. Merging upstream into main would therefore drag
# every upstream commit newer than our last release into our changelog and into
# our version calculation, including any upstream `feat!:` forcing a major bump
# on us. The pollution is bounded by date rather than ancestry, so its size
# varies unpredictably per release. No configuration fixes that.
#
# git-cliff can express what is needed, because it exposes `merge_commit` to its
# parsers. Skipping non-merge commits reduces main to exactly its first-parent
# spine: one entry per feature, which is precisely the fork's own changes.
#
# THE CONSEQUENCE, and it is load-bearing: a merge commit's SUBJECT becomes the
# changelog entry. Every pull request must be merged with a conventional-commit
# subject:
#     gh pr merge <n> --merge --subject "feat(scope): what changed (#<n>)"
# See docs/agent-playbooks/release-process.md.

[changelog]
header = """
# Changelog

Changes this fork makes to upstream Bee. Upstream's own changes are absorbed as
single `chore(upstream)` entries — see `.upstream-base` for the release this
build derives from, and upstream's release notes for what it contains.\n
"""
body = """
{% set repo = "https://github.com/crtahlin/wasp" -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = false
filter_commits = false

# Only this fork's own release tags are release boundaries. ANCHORED on purpose:
# an unanchored "v[0-9]*" also matches refs/tags/upstream/v2.8.1, which would
# make an upstream release act as one of ours.
tag_pattern = "^v[0-9]"

# NOTE: `replace` is a plain regex replacement — Tera variables from the
# [changelog] section do not interpolate here, so the URL is spelled out.
commit_preprocessors = [
  # Recover merges made with GitHub's default subject.
  #
  # `gh pr merge --subject` gives the conventional line directly, but a merge
  # done through the web interface produces
  #
  #     Merge pull request #104 from crtahlin/fix/90-rebuildable-keccak-blobs
  #
  #     fix(keccak): make the syso blobs rebuildable and reproducible
  #
  # which the "^Merge " parser below skips — so the change vanishes from the
  # changelog with no warning. That happened to #104. The conventional line is
  # not lost, only demoted to the body, so lift it back into the subject and
  # append the pull request number.
  #
  # The repository setting now defaults the subject to the pull request title,
  # so this should not recur; it stays because a silent omission from a release
  # artefact is not something to leave resting on one setting.
  { pattern = '(?s)^Merge pull request #(\d+) from \S+\s*\n\s*\n\s*(\S[^\n]*)', replace = "${2} (#${1})" },

  # Must run after the rule above, so the number it appends is linked too.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/crtahlin/wasp/pull/${1}))" },
]

# ORDER IS LOAD-BEARING: git-cliff applies the first matching parser.
commit_parsers = [
  # Keep only merge commits. Everything else on main arrived inside an upstream
  # sync merge and is not a change this fork made.
  { field = "merge_commit", pattern = "^false$", skip = true },

  # Merge commits that are NOT ours. Note the trailing space: this catches
  # "Merge branch ...", "Merge pull request ...", and also "Merge from
  # upstream", which a narrower pattern misses. Our own merge subjects are
  # conventional-commit lines and never begin with "Merge".
  { message = "^Merge ", skip = true },
  # One historical oddity in upstream's pre-v1 history that starts with neither.
  { message = "^Pull from upstream", skip = true },
  { message = "^chore\\(release\\)", skip = true },

  # Every rule below requires a trailing (#N), and the catch-all skips instead
  # of grouping. That is the whole mechanism for keeping the changelog to the
  # first-parent spine, and it is worth stating because the reason is not
  # visible from the rules themselves.
  #
  # merge_commit above keeps every commit with more than one parent, and
  # git-cliff walks the entire range rather than the spine. So a branch whose
  # own tip is a merge contributes twice: once as the pull request merge on the
  # spine, and once as the tip that merge brought in.
  #
  # Every upstream sync has exactly that shape by construction — the sync
  # branch is main with the upstream tag merged into it, so its tip is a merge
  # — and the v2.8.2 sync duly appeared twice under Upstream, once with (#149)
  # and once without. Rust's regex has no lookaround, so this cannot be
  # expressed as one negative rule; it has to be a condition on each.
  #
  # Everything that reaches main goes through a pull request and carries its
  # number. Anything on the spine that somehow does not is caught by
  # scripts/check-changelog-coverage.sh, which compares the rendered changelog
  # against the merges that actually happened and reports the gap rather than
  # letting it disappear quietly.
  { message = "^chore\\(upstream\\)[^\\n]*/pull/[0-9]+\\)\\)", group = "Upstream" },
  { message = "^[Ff]eat[^\\n]*/pull/[0-9]+\\)\\)",     group = "Features" },
  { message = "^[Ff]ix[^\\n]*/pull/[0-9]+\\)\\)",      group = "Bug fixes" },
  { message = "^[Pp]erf[^\\n]*/pull/[0-9]+\\)\\)",     group = "Performance" },
  { message = "^[Rr]evert[^\\n]*/pull/[0-9]+\\)\\)",   group = "Reverted" },
  { message = "^[Rr]efactor[^\\n]*/pull/[0-9]+\\)\\)", group = "Refactor" },
  { message = "^[Dd]oc[^\\n]*/pull/[0-9]+\\)\\)",      group = "Documentation" },
  { message = "^[Tt]est[^\\n]*/pull/[0-9]+\\)\\)",     group = "Testing" },
  { message = "^[Bb]uild[^\\n]*/pull/[0-9]+\\)\\)",    group = "Build" },
  { message = "^ci[^\\n]*/pull/[0-9]+\\)\\)",          group = "CI" },
  { message = "^[Cc]hore[^\\n]*/pull/[0-9]+\\)\\)",    group = "Miscellaneous" },
  { message = "[^\\n]*/pull/[0-9]+\\)\\)",             group = "Other" },
  { message = ".*",                          skip = true },
]

[bump]
# 0.x line: a feature is a patch bump and a breaking change is a minor bump,
# which is what semver prescribes below 1.0.0.
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "v0.1.0"
