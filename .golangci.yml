version: "2"
linters:
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - dogsled
    - durationcheck
    - errname
    - errorlint
    - forbidigo
    - gochecknoinits
    - goconst
    - goheader
    - goprintffuncname
    - importas
    - misspell
    - nilerr
    - noctx
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - thelper
    - unconvert
    - unused
  settings:
    goheader:
      values:
        regexp:
          date: 20[1-2][0-9]
      template: |-
        Copyright {{date}} The Swarm Authors. All rights reserved.
        Use of this source code is governed by a BSD-style
        license that can be found in the LICENSE file.
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    paralleltest:
      ignore-missing: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goheader
        text: go-ethereum Authors
      # Files authored for this fork carry "The bee-experimental Authors" rather
      # than "The Swarm Authors" — new work must not claim Swarm authorship.
      # Excluded the same way upstream excludes the inherited go-ethereum files,
      # which keeps the goheader template itself byte-identical to upstream and
      # therefore free of merge conflicts on every sync. See NOTICE-FORK.md.
      - linters:
          - goheader
        text: bee-experimental Authors
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - forbidigo
        path: cmd/bee/cmd
        text: use of `fmt.Print
      - linters:
          - dogsled
        path: pkg/api/(.+)_test\.go
      - linters:
          - dogsled
        path: pkg/pushsync/(.+)_test\.go
      - linters:
          - paralleltest
        path: pkg/log
      - linters:
          - staticcheck
        text: 'SA5008: should encoding/json ignore this field or name it "-"\? Either use `json:"-"` to ignore the field or use `json:"''-'',"` to specify "-" as the name'
      - linters:
          - staticcheck
        text: "SA5008: malformed `json` tag: invalid trailing ',' character"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
