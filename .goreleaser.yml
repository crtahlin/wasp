project_name: bee-experimental

version: 2

before:
  hooks:
    # Prime the module cache once up front so cross-compilation targets do not
    # each trigger their own dependency download.
    - go mod download

release:
  prerelease: auto

git:
  prerelease_suffix: "-"
  # Kept as defence in depth, but DO NOT RELY ON IT: ignore_tags did not filter
  # in snapshot mode. With an exp/chequebook-chain-disabled tag present and this
  # setting in place, goreleaser still derived the version from it and the build
  # failed on the slash becoming a path separator:
  #   open dist/bee-experimental-exp/chequebook-chain-disabled-snapshot.x86_64.rpm
  # The real fix is that experiment tags no longer contain a slash — see
  # docs/agent-playbooks/experiment-lifecycle.md. Naming, not configuration, is
  # what makes this safe.
  ignore_tags:
    - 'exp-*'
    - 'exp/*'
    # Upstream release tags live in a separate namespace (refs/tags/upstream/*,
    # see scripts/setup-upstream.sh). goreleaser reads git tags directly rather
    # than through the Makefile's --match guard, so without this it derives the
    # version from an upstream tag — and the slash in "upstream/v2.8.1" then
    # lands in package filenames as a path separator and the build fails.
    - 'upstream/*'

builds:
  - id: linux
    main: ./cmd/bee
    binary: bee
    flags:
      - -v
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ethersphere/bee/v2.version={{ .Version }}
      - -X github.com/ethersphere/bee/v2.commitHash={{ .ShortCommit }}
      - -X github.com/ethersphere/bee/v2.commitTime={{ .CommitTimestamp }}
      - -X github.com/ethersphere/bee/v2.upstreamBase={{ .Env.UPSTREAM_BASE }}
      - -X github.com/ethersphere/bee/v2/pkg/api.Version={{ .Env.BEE_API_VERSION }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - 386
      - arm64
      - arm
    goarm:
      - 7
  - id: linux-slim
    main: ./cmd/bee
    binary: bee-slim
    flags:
      - -v
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ethersphere/bee/v2.version={{ .Version }}
      - -X github.com/ethersphere/bee/v2.commitHash={{ .ShortCommit }}
      - -X github.com/ethersphere/bee/v2.commitTime={{ .CommitTimestamp }}
      - -X github.com/ethersphere/bee/v2.upstreamBase={{ .Env.UPSTREAM_BASE }}
      - -X github.com/ethersphere/bee/v2/pkg/api.Version={{ .Env.BEE_API_VERSION }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    hooks:
      post:
       - upx --best "{{ .Path }}"
  - id: windows
    main: ./cmd/bee
    binary: bee
    flags:
      - -v
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ethersphere/bee/v2.version={{ .Version }}
      - -X github.com/ethersphere/bee/v2.commitHash={{ .ShortCommit }}
      - -X github.com/ethersphere/bee/v2.commitTime={{ .CommitTimestamp }}
      - -X github.com/ethersphere/bee/v2.upstreamBase={{ .Env.UPSTREAM_BASE }}
      - -X github.com/ethersphere/bee/v2/pkg/api.Version={{ .Env.BEE_API_VERSION }}
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - 386
  - id: darwin-amd64
    main: ./cmd/bee
    binary: bee
    flags:
      - -v
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ethersphere/bee/v2.version={{ .Version }}
      - -X github.com/ethersphere/bee/v2.commitHash={{ .ShortCommit }}
      - -X github.com/ethersphere/bee/v2.commitTime={{ .CommitTimestamp }}
      - -X github.com/ethersphere/bee/v2.upstreamBase={{ .Env.UPSTREAM_BASE }}
      - -X github.com/ethersphere/bee/v2/pkg/api.Version={{ .Env.BEE_API_VERSION }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
  - id: darwin-arm64
    main: ./cmd/bee
    binary: bee
    flags:
      - -v
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ethersphere/bee/v2.version={{ .Version }}
      - -X github.com/ethersphere/bee/v2.commitHash={{ .ShortCommit }}
      - -X github.com/ethersphere/bee/v2.commitTime={{ .CommitTimestamp }}
      - -X github.com/ethersphere/bee/v2.upstreamBase={{ .Env.UPSTREAM_BASE }}
      - -X github.com/ethersphere/bee/v2/pkg/api.Version={{ .Env.BEE_API_VERSION }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64

snapshot:
  version_template: "{{.Tag}}-snapshot"

archives:

  -
    name_template: "{{ tolower .ProjectName }}-{{ tolower .Os }}-{{ tolower .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    # goreleaser v2 renamed `format` to `formats` (a list) and `builds` to `ids`.
    # Upstream still uses the deprecated spellings; corrected here so that
    # `goreleaser check` is clean.
    formats:
    - binary
    ids:
    - linux
    - windows
    - darwin-amd64
    - darwin-arm64


nfpms:
  - file_name_template: >-
      {{ tolower .ProjectName }}_
      {{- tolower .Version }}_
      {{- if eq .Arch "arm" }}armhf
      {{- else }}{{ tolower .Arch }}{{ end }}

    id: packages

    package_name: bee-experimental

    vendor: crtahlin

    homepage: https://github.com/crtahlin/bee-experimental

    maintainer: Crt Ahlin <crt.ahlin@gmail.com>

    description: |-
      Ethereum Swarm node (experimental fork of ethersphere/bee).
      Not affiliated with or endorsed by the Swarm Foundation.

    # Upstream declares GPL-3 here, but the project is BSD-3-Clause: see LICENSE,
    # and upstream's own scoops.license which says BSD-3-Clause. Upstream bug,
    # corrected in this fork.
    license: BSD-3-Clause

    # This fork carries its own version line starting at 0.1.0, which sorts below
    # upstream's 2.8.x. Without an epoch, apt would read an install over upstream
    # as a downgrade and refuse it. 1:0.1.0 outranks 0:2.8.1.
    epoch: "1"

    dependencies:
      - ca-certificates
      - adduser

    formats:
      - deb
      - rpm

    contents:
      - src: packaging/bee.service
        dst: /lib/systemd/system/bee.service
      - src: packaging/bee-get-addr
        dst: /usr/bin/bee-get-addr
      - src: packaging/bee.yaml
        dst: /etc/bee/bee.yaml
        type: config
      - src: packaging/default
        dst: /etc/default/bee
        type: config

    # Drop-in replacement for upstream's `bee` package. All three directives are
    # needed and do different jobs:
    #   Conflicts — refuse to be co-installed with upstream bee
    #   Replaces  — permitted to take over files it owns (/usr/bin/bee, the unit
    #               file, /etc/bee/bee.yaml)
    #   Provides  — satisfy anything that depends on the name `bee`
    # Conflicts alone blocks the install; Replaces alone allows a silent
    # file-ownership fight; Provides alone does neither.
    overrides:
      deb:
        conflicts: [bee]
        replaces: [bee]
        provides: [bee]
        dependencies:
          - passwd
          - ca-certificates
        scripts:
          preinstall: ./packaging/deb/preinst
          postinstall: ./packaging/deb/postinst
          preremove: ./packaging/deb/prerm
          postremove: ./packaging/deb/postrm
      rpm:
        # RPM has no Replaces; nfpm maps `replaces` onto Obsoletes for the rpm
        # packager. Verify on the first real build with `rpm -qp --obsoletes`.
        conflicts: [bee]
        replaces: [bee]
        provides: [bee]
        dependencies:
          - ca-certificates
          - shadow-utils
        file_name_template: >-
          {{ tolower .ProjectName }}-
          {{- tolower .Version }}.
          {{- if eq .Arch "amd64" }}x86_64
          {{- else if eq .Arch "arm64" }}aarch64
          {{- else }}{{ tolower .Arch }}{{ end }}
        scripts:
          preinstall: ./packaging/rpm/pre
          postinstall: ./packaging/rpm/post
          preremove: ./packaging/rpm/preun
          postremove: ./packaging/rpm/postun

    bindir: /usr/bin

# Container images are amd64 only. The ARM images were built under QEMU
# emulation on an x86 runner and dominated release time: in v0.1.0-test.1 the
# four ARM image builds took 14m52s, 18m29s, 20m4s and 22m57s, against seconds
# for amd64, making a release 26 minutes long.
#
# ARM BINARIES AND PACKAGES ARE STILL BUILT AND PUBLISHED — see builds: above
# and the deb/rpm in nfpms:. Those cross-compile in seconds because Go does not
# need emulation, and they are what an ARM operator actually needs; light nodes
# on ARM single-board machines are a real case. Only the container images are
# affected, and only for ARM.
#
# If ARM images are wanted later, the fix is a native ARM runner rather than
# QEMU. Re-adding them to this list without that would restore the 26 minutes.
dockers:
- image_templates:
  - "ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64"
  use: buildx
  ids:
    - linux
  goarch: amd64
  dockerfile: Dockerfile.goreleaser
  build_flag_templates:
  - "--platform=linux/amd64"
  - "--pull"
  - "--label=org.opencontainers.image.created={{.Date}}"
  - "--label=org.opencontainers.image.title={{.ProjectName}}"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}"
- image_templates:
  - "ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64-slim"
  use: buildx
  ids:
    - linux-slim
  goarch: amd64
  dockerfile: Dockerfile.scratch
  build_flag_templates:
  - "--platform=linux/amd64"
  - "--pull"
  - "--label=org.opencontainers.image.created={{.Date}}"
  - "--label=org.opencontainers.image.title={{.ProjectName}}"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}-slim"
docker_manifests:
- name_template: ghcr.io/crtahlin/bee-experimental:{{ .Major }}
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64
  skip_push: auto
- name_template: ghcr.io/crtahlin/bee-experimental:{{ .Major }}.{{ .Minor }}
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64
  skip_push: auto
- name_template: ghcr.io/crtahlin/bee-experimental:{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ with .Prerelease }}-{{ . }}{{ end }}
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64
- name_template: ghcr.io/crtahlin/bee-experimental:latest
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64
  # latest must never point at a prerelease (e.g. a -test build).
  skip_push: auto
- name_template: ghcr.io/crtahlin/bee-experimental:{{ .Major }}-slim
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64-slim
  skip_push: auto
- name_template: ghcr.io/crtahlin/bee-experimental:{{ .Major }}.{{ .Minor }}-slim
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64-slim
  skip_push: auto
- name_template: ghcr.io/crtahlin/bee-experimental:{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ with .Prerelease }}-{{ . }}{{ end }}-slim
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64-slim
- name_template: ghcr.io/crtahlin/bee-experimental:latest-slim
  image_templates:
  - ghcr.io/crtahlin/bee-experimental:{{ .Version }}-amd64-slim
  # latest must never point at a prerelease (e.g. a -test build).
  skip_push: auto
